<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Slides</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Markdown Slides</h1>

    <div class="main-buttons">
        <button id="createBtn">Create Slides</button>
        <button id="editBtn">Edit Slides</button>
        <button id="saveBtn">Save Slides</button>
        <button id="presentBtn">Present Slides</button>
        <span id="status" role="status" aria-live="polite"></span>
    </div>

    <main id="editScreen" class="edit-layout">
        <section class="left-section">
            <h2>Markdown Code</h2>
            <textarea id="editor" aria-label="Markdown slide editor" spellcheck="false"></textarea>
        </section>

        <section class="right-section">
            <h2>Live Preview</h2>
            <div class="viewer" id="viewerEdit">
                <div class="slide slide-content"></div>
                <div class="controls">
                    <button class="prev" type="button">Left</button>
                    <span class="count"></span>
                    <button class="next" type="button">Right</button>
                    <button class="fs" type="button">Full Screen</button>
                </div>
            </div>
        </section>
    </main>

    <main id="presentScreen" hidden>
        <div class="viewer" id="viewerPresent">
            <div class="slide slide-content"></div>
            <div class="controls">
                <button class="prev" type="button">Left</button>
                <span class="count"></span>
                <button class="next" type="button">Right</button>
                <button class="fs" type="button">Full Screen</button>
            </div>
        </div>
    </main>
</body>
</html>
